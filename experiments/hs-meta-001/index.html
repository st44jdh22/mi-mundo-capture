<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hey Sophie | Meta Display Test</title>
<style>
  :root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#000;color:#f5fcff}
  body{margin:0;min-height:100vh;display:grid;place-items:center}
  main{box-sizing:border-box;display:flex;flex-direction:column;gap:14px;width:min(100vw,600px);min-height:min(100vh,600px);padding:38px 32px;background:#000}
  h1{font-size:42px;line-height:1;margin:0;color:#95f4e2;font-weight:700} .sub{font-size:15px;color:#e5eff0;margin:2px 0 8px}
  button{display:block;width:100%;min-height:68px;color:#fff;border:2px solid #b0f4e9;border-radius:14px;background:#102526;font-size:25px;font-weight:650;text-align:left;padding:0 24px;cursor:pointer}
  button:focus-visible{outline:5px solid #f6d46e;outline-offset:2px;background:#265458}
  button[disabled]{opacity:.6;cursor:not-allowed}
  #send{background:#154d4a;text-align:center;margin-top:6px} #status{font-size:19px;line-height:1.4;min-height:75px;color:#f4dba6}
  footer{font-size:13px;color:#c4dad7;margin-top:auto}
  @media(max-height:590px){main{padding:18px 24px;gap:8px}button{min-height:52px}h1{font-size:32px}}
</style></head>
<body><main><h1>Hey Sophie</h1><p class="sub">META DISPLAY · NON-PRODUCTION UI TEST</p>
<button type="button" data-mode="photo">Photo</button>
<button type="button" data-mode="video">Video</button>
<button type="button" data-mode="audio">Audio recording</button>
<button type="button" id="send">Send</button>
<div id="status" role="status" aria-live="polite">Native glasses capture is not connected.</div>
<footer>Neural Band test: move focus with arrows, select with pinch/Enter. No media or credentials leave this page.</footer>
</main><script type="module">
import {CaptureController} from './controller.mjs';
// Intentionally absent: Meta Device Access Toolkit is an iOS/Android SDK, not an ordinary Web App camera bridge.
const status=document.querySelector('#status');
const controller=new CaptureController(null, ({message}) => {status.textContent=message});
for(const button of document.querySelectorAll('[data-mode]')) button.addEventListener('click',()=>controller.choose(button.dataset.mode));
document.querySelector('#send').addEventListener('click',()=>controller.send());
const buttons=Array.from(document.querySelectorAll('button'));
document.addEventListener('keydown',event=>{
  if(!['ArrowUp','ArrowDown'].includes(event.key))return;
  event.preventDefault();
  const current=buttons.indexOf(document.activeElement);
  buttons[(current+(event.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length].focus();
});
buttons[0].focus();
</script></body></html>
