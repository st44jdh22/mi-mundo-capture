name: Test-only durable filing recovery
on:
  pull_request:
    branches: [review/chef-conversation-mvp, review/p0-agent-preflight-20261020]
  push:
    branches: [review/postoffice-filing-recovery, review/food-chef-automatic-roundtrip]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-filing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: po_filing_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r integration/recovery_requirements.txt httpx
      - run: python -m compileall -q integration
      - name: SQLite acceptance and existing integration regressions
        working-directory: integration
        run: python -m unittest discover -s . -v
      - name: Disposable PostgreSQL full filing contract
        working-directory: integration
        env:
          MI_MUNDO_FILING_TEST_PG_URL: postgresql+psycopg://postgres:synthetic-ci-only@localhost:5432/po_filing_test
        run: python -m unittest -v test_filing_service.FilingPostgresTests
      - name: A58 and Chef fault-injection demonstration
        working-directory: integration
        run: python run_filing_acceptance.py
      - name: Automatic authenticated Chef HTTP round trip (zero model calls)
        working-directory: integration
        run: python run_chef_automatic.py
